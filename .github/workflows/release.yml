name: Release

# A vX.Y.Z tag publishes a release. 0.x versions are early access: the patch
# number goes up for small updates, the minor number for big ones, and 1.0.0
# marks the first stable release. No -beta or other suffix.
#
# Everything is built and checked first; the release is then created as a
# draft with every file attached and published in one step, so
# /releases/latest (read by the updater and the install scripts) never shows
# a release without its files.
#
# A pull request that changes this file, or a manual run, is a dry run: the
# same builds and checks, with the files kept as a workflow artifact
# ("release-files") and nothing published.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # The version must be the same in the tag and in all four files that hold
  # it, and a tagged release needs its notes file. Checked before anything
  # is built: a tag can't be moved or deleted (ruleset), so a tag that fails
  # here is cheaper to replace with the next patch version than one that
  # fails later.
  prepare:
    name: Check version and notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions agree
        id: version
        run: |
          cargo_version() { grep -m1 '^version = ' "$1" | cut -d'"' -f2; }
          root="$(cargo_version Cargo.toml)"
          gui_crate="$(cargo_version gui/src-tauri/Cargo.toml)"
          tauri="$(node -p "require('./gui/src-tauri/tauri.conf.json').version")"
          package="$(node -p "require('./gui/package.json').version")"
          echo "Cargo.toml $root, gui/src-tauri/Cargo.toml $gui_crate, tauri.conf.json $tauri, gui/package.json $package"
          for v in "$gui_crate" "$tauri" "$package"; do
            if [[ "$v" != "$root" ]]; then
              echo "::error::the four version fields don't agree"; exit 1
            fi
          done
          if [[ ! "$root" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$root' is not X.Y.Z"; exit 1
          fi
          publish=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$root" ]]; then
              echo "::error::tag '$GITHUB_REF_NAME' doesn't match the version v$root"; exit 1
            fi
            publish=true
          fi
          echo "version=$root" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Release notes exist
        run: |
          notes="release-notes/v${{ steps.version.outputs.version }}.md"
          if [[ -s "$notes" ]]; then
            echo "using $notes"
          elif [[ "${{ steps.version.outputs.publish }}" == "true" ]]; then
            echo "::error::missing $notes"; exit 1
          else
            echo "::warning::missing $notes (needed before tagging)"
          fi

  # The licences of everything built into the terminal app (Apache-2.0 / BSD
  # / MIT notices travel with redistributed binaries). realm-core is C++, so
  # the script appends its notices by hand.
  licences:
    name: Third-party licences (terminal app)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # The prebuilt binary, not `cargo install`: compiling cargo-about took
      # minutes on every run. 0.9.2 is the version scripts/third-party-licenses.sh
      # expects.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about@0.9.2
      - name: Build THIRD-PARTY-LICENSES.txt
        run: scripts/third-party-licenses.sh THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-licences
          path: THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  # The terminal app. Each target builds on its NATIVE runner so realm-cpp
  # (vendored C++ submodule) links against the platform's own toolchain;
  # windows is MSVC, no cross-build. The asset names are what the self-updater
  # and install scripts look for, so they only change with a bridge release:
  # 0.3.0 publishes every binary under both its new osu-shelf-* name and the
  # old osu-collect-* one, so 0.2.0's updater can still find it. Drop the old
  # copies after a release or two.
  build:
    name: Build ${{ matrix.asset_name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # windows-latest ships Git Bash; keeps cp + forward-slash paths uniform
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: the binary runs on distributions whose glibc
          # is at least the build machine's (2.35 here).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset_name: osu-shelf-linux-x64
            legacy_asset_name: osu-collect-linux-x64
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: osu-shelf-windows-x64
            legacy_asset_name: osu-collect-windows-x64
            ext: .exe
          # Pinned, not macos-latest, so the build machine only changes on purpose.
          - target: aarch64-apple-darwin
            os: macos-15
            asset_name: osu-shelf-macos-arm64
            legacy_asset_name: osu-collect-macos-arm64
            ext: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zlib1g-dev libssl-dev

      - name: Install native deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      # The oldest macOS the apps support, from the desktop app's
      # bundle.macOS.minimumSystemVersion. rustc, cc and CMake (realm-core)
      # all read MACOSX_DEPLOYMENT_TARGET, so nothing is built for the
      # runner's own, newer macOS.
      - name: Target the oldest supported macOS
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(node -p "require('./gui/src-tauri/tauri.conf.json').bundle.macOS.minimumSystemVersion")" >> "$GITHUB_ENV"

      # Keyed by runner image, so a new image starts from a clean build.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check it runs on the oldest supported macOS
        if: runner.os == 'macOS'
        run: scripts/check-macos-min.sh "$MACOSX_DEPLOYMENT_TARGET" "target/${{ matrix.target }}/release/osu-shelf" "target/${{ matrix.target }}/release/build"

      - name: Check the version it reports
        run: |
          out="$("target/${{ matrix.target }}/release/osu-shelf${{ matrix.ext }}" --version)"
          echo "$out"
          [[ "$out" == "osu-shelf ${{ needs.prepare.outputs.version }}" ]]

      - name: Prepare asset
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/osu-shelf${{ matrix.ext }}" "out/${{ matrix.asset_name }}${{ matrix.ext }}"
          cp "out/${{ matrix.asset_name }}${{ matrix.ext }}" "out/${{ matrix.legacy_asset_name }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.asset_name }}
          path: out/*
          if-no-files-found: error

  # The desktop app's installers and its licence list (desktop.yml).
  desktop:
    name: Desktop app
    needs: prepare
    uses: ./.github/workflows/desktop.yml

  # Collects every file, writes SHA256SUMS, and keeps the set as one artifact.
  # On a tag it then creates the release as a draft with every file attached
  # and publishes it; on a dry run it stops after the artifact.
  release:
    name: ${{ needs.prepare.outputs.publish == 'true' && 'Publish release' || 'Collect files (dry run)' }}
    needs: [prepare, licences, build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # Explicit list, so a missing file fails here and nothing else (such as
      # desktop.yml's licence list before the AppImage section) slips in.
      - name: Collect the release files
        run: |
          d="osu-shelf-desktop-$VERSION"
          mkdir -p release
          cp artifacts/cli-osu-shelf-linux-x64/osu-shelf-linux-x64 \
             artifacts/cli-osu-shelf-linux-x64/osu-collect-linux-x64 \
             artifacts/cli-osu-shelf-windows-x64/osu-shelf-windows-x64.exe \
             artifacts/cli-osu-shelf-windows-x64/osu-collect-windows-x64.exe \
             artifacts/cli-osu-shelf-macos-arm64/osu-shelf-macos-arm64 \
             artifacts/cli-osu-shelf-macos-arm64/osu-collect-macos-arm64 \
             artifacts/cli-licences/THIRD-PARTY-LICENSES.txt \
             "artifacts/desktop-linux-x64/$d-linux-x64.AppImage" \
             "artifacts/desktop-linux-x64/$d-linux-amd64.deb" \
             artifacts/desktop-linux-x64/THIRD-PARTY-LICENSES-desktop.txt \
             "artifacts/desktop-windows-x64/$d-windows-x64-setup.exe" \
             "artifacts/desktop-macos-arm64/$d-macos-arm64.dmg" \
             release/
          chmod +x release/osu-shelf-linux-x64 release/osu-collect-linux-x64 \
                   release/osu-shelf-macos-arm64 release/osu-collect-macos-arm64 \
                   "release/$d-linux-x64.AppImage"
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/*
          if-no-files-found: error
          retention-days: 7

      # The self-updater and install scripts check each file against the
      # SHA-256 GitHub records for it (the asset's `digest`); SHA256SUMS is
      # for people checking by hand.
      - name: Create the draft release with every file, then publish it
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file "release-notes/$TAG.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --discussion-category Announcements
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets \
            --jq '"\(.url) draft=\(.isDraft) prerelease=\(.isPrerelease) files=\(.assets | length)"'
