name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

# Least-privilege default: read-only token. Build jobs only upload ephemeral
# artifacts (no GitHub Release publish), which needs no extra scope.
permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes don't stack.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force HTTP/1.1 for registry downloads: curl's HTTP/2 multiplexing against the
# crates.io CDN intermittently dies with "[16] Error in the HTTP2 framing layer"
# on the hosted runners. Extra retries cover the remaining transient blips.
env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt --check
        run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # --workspace: the desktop app crate too (cargo-deny only checks the
          # root crate otherwise, since default-members = ["."]).
          arguments: --all-features --workspace
          command: check advisories licenses bans sources

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit

  # The desktop app's Svelte frontend: type-check and a production build.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: svelte-check
        run: pnpm check
      - name: build
        run: pnpm build

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zlib1g-dev libssl-dev
          # The desktop app (Tauri): WebKitGTK and its GTK/soup stack, librsvg for icons.
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2

      # --workspace covers the desktop app crate (gui/src-tauri) and osu-downloader;
      # plain cargo only builds default-members = ["."].
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --release --target x86_64-unknown-linux-gnu -- -D warnings

      - name: test
        run: cargo test --release --all-targets --all-features --target x86_64-unknown-linux-gnu

      - name: test desktop app crate
        run: cargo test --release -p osu-collect-gui --all-features --target x86_64-unknown-linux-gnu

      - name: test osu-downloader lib
        run: cargo test --manifest-path osu-downloader/Cargo.toml --all-features

      - name: Build for Linux
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/osu-collect dist/osu-collect-linux-x64
          chmod +x dist/osu-collect-linux-x64
          cd dist && sha256sum osu-collect-linux-x64 > osu-collect-linux-x64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: osu-collect-linux-x64
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/osu-collect-linux-x64
            dist/osu-collect-linux-x64.sha256

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # --workspace covers the desktop app crate (gui/src-tauri) and osu-downloader.
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --release --target x86_64-pc-windows-msvc -- -D warnings

      - name: test
        run: cargo test --release --all-targets --all-features --target x86_64-pc-windows-msvc

      - name: test desktop app crate
        run: cargo test --release -p osu-collect-gui --all-features --target x86_64-pc-windows-msvc

      - name: Build for Windows
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/x86_64-pc-windows-msvc/release/osu-collect.exe dist/osu-collect-windows-x64.exe
          Get-FileHash dist/osu-collect-windows-x64.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  osu-collect-windows-x64.exe" } |
            Out-File -Encoding ascii dist/osu-collect-windows-x64.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: osu-collect-windows-x64
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/osu-collect-windows-x64.exe
            dist/osu-collect-windows-x64.exe.sha256

  build-macos:
    # Pinned, not macos-latest, so the build machine only changes on purpose.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The oldest macOS the apps support, from the desktop app's
      # bundle.macOS.minimumSystemVersion. rustc, cc and CMake (realm-core)
      # all read MACOSX_DEPLOYMENT_TARGET, so nothing is built for the
      # runner's own, newer macOS.
      - name: Target the oldest supported macOS
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(node -p "require('./gui/src-tauri/tauri.conf.json').bundle.macOS.minimumSystemVersion")" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: brew install cmake

      # Keyed by runner image, so a new image starts from a clean build.
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-15

      # --workspace covers the desktop app crate (gui/src-tauri) and osu-downloader.
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --release --target aarch64-apple-darwin -- -D warnings

      - name: test
        run: cargo test --release --all-targets --all-features --target aarch64-apple-darwin

      - name: test desktop app crate
        run: cargo test --release -p osu-collect-gui --all-features --target aarch64-apple-darwin

      - name: Build for macOS (arm64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Check it runs on the oldest supported macOS
        run: scripts/check-macos-min.sh "$MACOSX_DEPLOYMENT_TARGET" target/aarch64-apple-darwin/release/osu-collect target/aarch64-apple-darwin/release/build

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/osu-collect dist/osu-collect-macos-arm64
          chmod +x dist/osu-collect-macos-arm64
          cd dist && shasum -a 256 osu-collect-macos-arm64 > osu-collect-macos-arm64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: osu-collect-macos-arm64
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/osu-collect-macos-arm64
            dist/osu-collect-macos-arm64.sha256
