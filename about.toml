# cargo-about config: the licence listing shipped with every release
# (THIRD-PARTY-LICENSES.txt, built by scripts/third-party-licenses.sh).
#
# Where a crate offers a choice, the first accepted licence below is the one
# listed, so the permissive ones come first.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
]

# The release targets (see .github/workflows/release.yml).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

# Only what ends up in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# ring and rustls ship licence files cargo-about can't match on its own.
workarounds = ["ring", "rustls"]
