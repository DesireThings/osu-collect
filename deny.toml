# cargo-deny config: licence, advisory, ban and source checks. Run by the `deny`
# job in ci.yml and weekly by advisories.yml. The licence list matches the
# `accepted` list in about.toml, so what is allowed here is what the shipped
# licence listing can show.

[graph]
all-features = true

[advisories]
# cargo-deny 0.16+ denies every advisory class by default; silence specifics via `ignore`.
# `unmaintained` re-added in 0.18.2: all | workspace | transitive | none (NOT deny/warn).
yanked       = "deny"
unmaintained = "workspace"  # flag unmaintained direct deps, not deep transitives we can't control
ignore       = []

[licenses]
confidence-threshold = 0.8  # cargo-deny's default, stated for clarity
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "BSL-1.0",
  "0BSD",
  "MIT-0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards         = "deny"
# The GUI crate depends on the root crate by path with no version; it isn't
# published (publish = false), so that path dependency is fine.
allow-wildcard-paths = true
deny              = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
